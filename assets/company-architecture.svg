<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Una Labs company architecture</title>
  <desc id="desc">A four-stage architecture from client demand through the Una Labs delivery system, product platform, and trust and release controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#07131b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12304a"/>
      <stop offset="1" stop-color="#0d2236"/>
    </linearGradient>
    <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#103a39"/>
      <stop offset="1" stop-color="#0b282b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <circle cx="1070" cy="-40" r="250" fill="#0e7490" opacity=".12"/>
  <circle cx="80" cy="720" r="260" fill="#14b8a6" opacity=".08"/>

  <text x="64" y="74" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Una Labs delivery architecture</text>
  <text x="64" y="108" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">One governed path from an unclear request to a secure, supportable product.</text>
  <rect x="64" y="130" width="1072" height="3" rx="2" fill="url(#brand)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g filter="url(#shadow)">
      <rect x="64" y="180" width="238" height="334" rx="22" fill="url(#cardA)" stroke="#2563eb" stroke-opacity=".8"/>
      <rect x="334" y="180" width="238" height="334" rx="22" fill="url(#cardB)" stroke="#14b8a6" stroke-opacity=".9"/>
      <rect x="604" y="180" width="238" height="334" rx="22" fill="url(#cardA)" stroke="#38bdf8" stroke-opacity=".8"/>
      <rect x="874" y="180" width="262" height="334" rx="22" fill="url(#cardB)" stroke="#4ade80" stroke-opacity=".8"/>
    </g>

    <g fill="none" stroke="url(#brand)" stroke-width="3" stroke-linecap="round">
      <path d="M302 347H334"/>
      <path d="M572 347H604"/>
      <path d="M842 347H874"/>
    </g>
    <g fill="#2dd4bf">
      <path d="M329 339l10 8-10 8z"/>
      <path d="M599 339l10 8-10 8z"/>
      <path d="M869 339l10 8-10 8z"/>
    </g>

    <g>
      <rect x="88" y="205" width="42" height="30" rx="15" fill="#2563eb"/>
      <text x="109" y="226" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">01</text>
      <text x="88" y="270" fill="#f8fafc" font-size="21" font-weight="700">Client signal</text>
      <text x="88" y="299" fill="#93c5fd" font-size="13" font-weight="600">DISCOVER AND FRAME</text>
      <text x="88" y="342" fill="#dbeafe" font-size="15">Founders and teams</text>
      <text x="88" y="374" fill="#dbeafe" font-size="15">Service businesses</text>
      <text x="88" y="406" fill="#dbeafe" font-size="15">Internal ventures</text>
      <text x="88" y="454" fill="#94a3b8" font-size="13">Structured intake</text>
      <text x="88" y="478" fill="#94a3b8" font-size="13">Requirements • risks • outcomes</text>
    </g>

    <g>
      <rect x="358" y="205" width="42" height="30" rx="15" fill="#0f766e"/>
      <text x="379" y="226" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">02</text>
      <text x="358" y="270" fill="#f8fafc" font-size="21" font-weight="700">Delivery system</text>
      <text x="358" y="299" fill="#5eead4" font-size="13" font-weight="600">SCOPE AND GOVERN</text>
      <text x="358" y="342" fill="#ccfbf1" font-size="15">Proposal and approval</text>
      <text x="358" y="374" fill="#ccfbf1" font-size="15">Milestones and ownership</text>
      <text x="358" y="406" fill="#ccfbf1" font-size="15">Client portal and reporting</text>
      <text x="358" y="454" fill="#94a3b8" font-size="13">Human approval checkpoints</text>
      <text x="358" y="478" fill="#94a3b8" font-size="13">Handover-ready evidence</text>
    </g>

    <g>
      <rect x="628" y="205" width="42" height="30" rx="15" fill="#0284c7"/>
      <text x="649" y="226" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">03</text>
      <text x="628" y="270" fill="#f8fafc" font-size="21" font-weight="700">Product platform</text>
      <text x="628" y="299" fill="#7dd3fc" font-size="13" font-weight="600">BUILD AND INTEGRATE</text>
      <text x="628" y="342" fill="#e0f2fe" font-size="15">Web • mobile • games</text>
      <text x="628" y="374" fill="#e0f2fe" font-size="15">APIs • AI • automation</text>
      <text x="628" y="406" fill="#e0f2fe" font-size="15">Isolated product data</text>
      <text x="628" y="454" fill="#94a3b8" font-size="13">Cloudflare • Railway</text>
      <text x="628" y="478" fill="#94a3b8" font-size="13">Supabase • Postgres • D1</text>
    </g>

    <g>
      <rect x="898" y="205" width="42" height="30" rx="15" fill="#15803d"/>
      <text x="919" y="226" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">04</text>
      <text x="898" y="270" fill="#f8fafc" font-size="21" font-weight="700">Trust and release</text>
      <text x="898" y="299" fill="#86efac" font-size="13" font-weight="600">PROVE AND OPERATE</text>
      <text x="898" y="342" fill="#dcfce7" font-size="15">JWT • RLS • least privilege</text>
      <text x="898" y="374" fill="#dcfce7" font-size="15">CI and protected environments</text>
      <text x="898" y="406" fill="#dcfce7" font-size="15">Health • tests • proof ledgers</text>
      <text x="898" y="454" fill="#94a3b8" font-size="13">Evidence before claims</text>
      <text x="898" y="478" fill="#94a3b8" font-size="13">Rollback and recovery paths</text>
    </g>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="64" y="558" width="1072" height="82" rx="18" fill="#0f1e2d" stroke="#334155"/>
    <text x="88" y="592" fill="#94a3b8" font-size="12" font-weight="700">OPERATING PRINCIPLES</text>
    <text x="88" y="620" fill="#e2e8f0" font-size="14">Edge first</text>
    <circle cx="184" cy="615" r="3" fill="#2dd4bf"/>
    <text x="203" y="620" fill="#e2e8f0" font-size="14">Persistent compute only when needed</text>
    <circle cx="455" cy="615" r="3" fill="#2dd4bf"/>
    <text x="474" y="620" fill="#e2e8f0" font-size="14">Product-isolated data</text>
    <circle cx="642" cy="615" r="3" fill="#2dd4bf"/>
    <text x="661" y="620" fill="#e2e8f0" font-size="14">Human-governed AI</text>
    <circle cx="830" cy="615" r="3" fill="#2dd4bf"/>
    <text x="849" y="620" fill="#e2e8f0" font-size="14">No production claim without proof</text>
  </g>
</svg>
